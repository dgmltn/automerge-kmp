[package]
name = "uniffi_automerge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "uniffi_automerge"

[dependencies]
automerge = { version = "0.12.0", default-features = false, features = ["wasm", "utf16-indexing"] }
thiserror = "1.0.38"
uniffi = "=0.29.4"

[build-dependencies]
uniffi = { version = "=0.29.4", features = ["build"] }
